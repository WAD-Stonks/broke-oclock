name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Install from the single lockfile
        run: bun install --frozen-lockfile
      - name: Create ephemeral local configuration and generate client
        run: bun run setup
      - name: Lint, schema, typechecks, unit tests and builds
        run: bun run check
      - name: Known high/critical dependency advisories
        run: bun run audit
      - name: Real auth/database integration tests
        run: bun run test:integration
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

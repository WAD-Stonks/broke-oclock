name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Install from the single lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create ephemeral local configuration and generate client
        run: pnpm run setup
      - name: Lint, schema, typechecks, unit tests and builds
        run: pnpm run check
      - name: Known high/critical dependency advisories
        run: pnpm run audit
      - name: Real auth/database integration tests
        run: pnpm run test:integration
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
